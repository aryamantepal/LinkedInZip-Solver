<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>LinkedIn Zip Solver</title>
    <style>
        body {
            width: 320px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background: #ffffff;
            color: #1f2328;
            box-sizing: border-box;
        }

        h1 {
            color: #0a66c2;
            font-size: 17px;
            margin: 0 0 12px 0;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-box {
            text-align: center;
            padding: 10px;
            background: #f1f3f4;
            border: 1px solid #dadce0;
            border-radius: 8px;
            color: #3c4043;
            font-size: 13px;
            margin-bottom: 14px;
            line-height: 1.4;
            font-weight: 500;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 9px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background: #0a66c2;
            color: white;
            width: 100%;
        }

        .btn-success {
            background: #10b981;
            color: white;
            flex: 1;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
            flex: 1;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #4b5563;
            border: 1px solid #d1d5db;
            width: 100%;
            font-size: 12px;
        }

        .instructions {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 12px;
            line-height: 1.5;
            counter-reset: step-counter;
        }

        .step {
            margin: 6px 0;
            padding-left: 22px;
            position: relative;
        }

        .step::before {
            content: counter(step-counter);
            counter-increment: step-counter;
            position: absolute;
            left: 0;
            top: 2px;
            background: #0a66c2;
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .github-link {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
        }

        .github-link a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: 500;
        }

        .github-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>⚡ LinkedIn Zip Solver</h1>

    <div id="status-box" class="status-box">
        Checking game status...
    </div>

    <div id="actions-container" class="actions">
        <button id="popup-solve-btn" class="btn-primary">🧩 Solve Puzzle</button>
        <div class="btn-group">
            <button id="popup-show-btn" class="btn-success">👁 Show Path</button>
            <button id="popup-autoplay-btn" class="btn-warning">▶ Auto Play</button>
        </div>
        <button id="popup-clear-btn" class="btn-secondary">🗑 Clear Overlays</button>
    </div>

    <div class="instructions">
        <div class="step">Go to <code>linkedin.com/games/zip</code></div>
        <div class="step">Use this popup or the on-screen control panel</div>
        <div class="step">Click <strong>Solve</strong> to analyze and compute the winning path</div>
        <div class="step">Click <strong>Show Path</strong> to see the path or <strong>Auto Play</strong> to solve it</div>
    </div>

    <div class="github-link">
        <a href="#" id="help-link">GitHub Repository &amp; Updates</a>
    </div>

    <script src="popup.js"></script>
</body>

</html>
